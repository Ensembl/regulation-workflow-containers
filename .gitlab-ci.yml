services:
  - docker:20-dind

include:
  - local: 'configs/gitlab-ci/**.yml'

stages:
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  RDR_DOCKER_CONFIG_DIR: .

.test:
  image: docker:20.10
  stage: test
  before_script:
    - docker --version
    - docker-compose --version
  script:
    - |
      if [ -f ${DOCKERFILE_DIR}/docker-compose.test.yml ]; then
          docker compose \
          --file ${DOCKERFILE_DIR}/docker-compose.test.yml up \
          --build \
          --exit-code-from sut
      else
          docker build \
          ${DOCKERFILE_DIR} \
          --file ${DOCKERFILE_DIR}/Dockerfile
      fi

.build:
  image: docker:20.10
  stage: build
  variables:
    CR_NAME: ${CI_REGISTRY_IMAGE}/${CONTAINER_IMAGE_NAME}
    DOCKERHUB_NAME: ensemblorg/${CONTAINER_IMAGE_NAME}
    # TODO: Consider splitting this into two jobs, one for building and one for pushing
    # TODO: Consider splitting in different jobs pushing to GitLab Container Registry and Docker Hub
  script:
    # TODO More secure way to authenticate to GitLab Container Registry
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build --pull --rm=true -t ${CR_NAME}:latest ${DOCKERFILE_DIR}
    - SOFTWARE_VERSION=$(docker inspect --format '{{ index .Config.Labels "software.version"}}' ${CR_NAME})
    - docker tag ${CR_NAME}:latest ${CR_NAME}:${SOFTWARE_VERSION}
    - docker push ${CR_NAME}:latest
    - docker push ${CR_NAME}:${SOFTWARE_VERSION}
    # TODO: More secure way to authenticate to Docker Hub
    # - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    # - docker tag ${CR_NAME}:latest ${DOCKERHUB_NAME}:latest
    # - docker tag ${CR_NAME}:latest ${DOCKERHUB_NAME}:${SOFTWARE_VERSION}
    # - docker push ${DOCKERHUB_NAME}:latest
    # - docker push ${DOCKERHUB_NAME}:${SOFTWARE_VERSION}
  after_script:
    - docker logout ${CI_REGISTRY}


