.bedtools-2.31.0:
  variables:
    IMAGE_NAME: bedtools
    IMAGE_VERSION: 2.31.0
    DOCKERFILE_DIR: dockerfiles/${IMAGE_NAME}/${IMAGE_VERSION}
  # TODO: It would be good if we could use DOCKERFILE_DIR in rules:changes. It didn't work when I tested it in GitLab 15.11.6-ee
  rules:
    # Scheduled pipelines rebuild every image so that security updates
    # published since the last build are picked up.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes:
        - configs/gitlab-ci/bedtools/2.31.0.yml
        - dockerfiles/bedtools/2.31.0/*
        - .gitlab-ci.yml

test-bedtools-2.31.0:
  extends:
    - .test
    - .bedtools-2.31.0
  needs: [ "build-bedtools-2.31.0" ]

build-bedtools-2.31.0:
  extends:
    - .build
    - .bedtools-2.31.0
  variables:
    CONTAINER_IMAGE_NAME: ${IMAGE_NAME}
  


scan-bedtools-2.31.0:
  extends:
    - .container_scanning
    - .bedtools-2.31.0
  variables:
    CS_IMAGE: ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${IMAGE_VERSION}
    CS_DOCKERFILE_PATH: ${DOCKERFILE_DIR}/Dockerfile
  needs: [ "test-bedtools-2.31.0" ]

scan-bedtools-latest:
  extends:
    - .container_scanning
    - .bedtools-2.31.0
  variables:
    CS_IMAGE: ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest
    CS_DOCKERFILE_PATH: ${DOCKERFILE_DIR}/Dockerfile
  needs: [ "test-bedtools-2.31.0" ]