.fastp:
  variables:
    DOCKERFILE_DIR: dockerfiles/fastp
  # TODO: It would be good if we could use DOCKERFILE_DIR in rules:changes. It didn't work when I tested it in GitLab 15.11.6-ee
  rules:
    - changes:
        - configs/gitlab-ci/fastp.yml
        - dockerfiles/fastp/*
        - .gitlab-ci.yml

test-fastp:
  extends:
    - .test
    - .fastp

build-fastp:
  extends:
    - .build
    - .fastp
  variables:
    CONTAINER_IMAGE_NAME: fastp
  needs: [ "test-fastp" ]
