.bash-5.2.21:
  variables:
    IMAGE_NAME: bash
    IMAGE_VERSION: 5.2.21
    DOCKERFILE_DIR: dockerfiles/${IMAGE_NAME}/${IMAGE_VERSION}
  # TODO: It would be good if we could use DOCKERFILE_DIR in rules:changes. It didn't work when I tested it in GitLab 15.11.6-ee
  rules:
    - changes:
        - configs/gitlab-ci/bash/5.2.21.yml
        - dockerfiles/bash/5.2.21/*
        - .gitlab-ci.yml

test-bash-5.2.21:
  extends:
    - .test
    - .bash-5.2.21

build-bash-5.2.21:
  extends:
    - .build
    - .bash-5.2.21
  variables:
    CONTAINER_IMAGE_NAME: ${IMAGE_NAME}
  needs: [ "test-bash-5.2.21" ]


scan-bash-5.2.21:
  extends:
    - .container_scanning
    - .bash-5.2.21
  variables:
    CS_IMAGE: ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${IMAGE_VERSION}
    CS_DOCKERFILE_PATH: ${DOCKERFILE_DIR}/Dockerfile
  needs: [ "build-bash-5.2.21" ]