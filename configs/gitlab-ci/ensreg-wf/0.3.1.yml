.ensreg-wf-0.3.1:
  variables:
    IMAGE_NAME: ensreg-wf
    IMAGE_VERSION: 0.3.1
    DOCKERFILE_DIR: dockerfiles/${IMAGE_NAME}/${IMAGE_VERSION}
  # TODO: It would be good if we could use DOCKERFILE_DIR in rules:changes. It didn't work when I tested it in GitLab 15.11.6-ee
  rules:
    - changes:
        - configs/gitlab-ci/ensreg-wf/0.3.1.yml
        - dockerfiles/ensreg-wf/0.3.1/*
        - .gitlab-ci.yml

test-ensreg-wf-0.3.1:
  extends:
    - .test
    - .ensreg-wf-0.3.1
  needs: [ "build-ensreg-wf-0.3.1" ]

build-ensreg-wf-0.3.1:
  extends:
    - .build
    - .ensreg-wf-0.3.1
  variables:
    CONTAINER_IMAGE_NAME: ${IMAGE_NAME}
  


scan-ensreg-wf-0.3.1:
  extends:
    - .container_scanning
    - .ensreg-wf-0.3.1
  variables:
    CS_IMAGE: ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${IMAGE_VERSION}
    CS_DOCKERFILE_PATH: ${DOCKERFILE_DIR}/Dockerfile
  needs: [ "test-ensreg-wf-0.3.1" ]

scan-ensreg-wf-latest:
  extends:
    - .container_scanning
    - .ensreg-wf-0.3.1
  variables:
    CS_IMAGE: ${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest
    CS_DOCKERFILE_PATH: ${DOCKERFILE_DIR}/Dockerfile
  needs: [ "test-ensreg-wf-0.3.1" ]