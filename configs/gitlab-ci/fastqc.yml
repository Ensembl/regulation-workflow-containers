.fastqc:
  variables:
    DOCKERFILE_DIR: dockerfiles/fastqc
  # TODO: It would be good if we could use DOCKERFILE_DIR in rules:changes. It didn't work when I tested it in GitLab 15.11.6-ee
  rules:
    - changes:
        - configs/gitlab-ci/fastqc.yml
        - dockerfiles/fastqc/*
        - .gitlab-ci.yml

test-fastqc:
  extends:
    - .test
    - .fastqc

build-fastqc:
  extends:
    - .build
    - .fastqc
  variables:
    CONTAINER_IMAGE_NAME: fastqc
  needs: [ "test-fastqc" ]
